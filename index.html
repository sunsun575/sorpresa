/*
=========================================================
              CÓDIGO DE LA ÚLTIMA PRUEBA
=========================================================

CAMBIA ESTE NÚMERO POR EL QUE TÚ QUIERAS.

Ejemplo:
const SECRET_CODE = "0909";

=========================================================
*/

const SECRET_CODE = "0909";


/*
=========================================================
                OBTENER SORPRESA ACTUAL
=========================================================
*/

function getCurrentSurprise() {

  const now = new Date();

  let current = surprises[0];

  for (let i = 0; i < surprises.length; i++) {

    if (now >= surprises[i].date) {
      current = surprises[i];
    }

  }

  return current;
}


/*
=========================================================
                PRÓXIMA SORPRESA
=========================================================
*/

function getNextSurprise() {

  const now = new Date();

  for (let i = 0; i < surprises.length; i++) {

    if (surprises[i].date > now) {
      return surprises[i];
    }

  }

  return null;
}


/*
=========================================================
                    COUNTDOWN
=========================================================
*/

function updateCountdown() {

  const now = new Date();

  /*
  Antes del 9 de septiembre
  */

  if (now < START_DATE) {

    const distance = START_DATE - now;

    showLockedCountdown(
      distance,
      "Todavía no...",
      "Esta pequeña sorpresa todavía no está disponible 👀"
    );

    return;
  }


  /*
  Después del inicio pero antes del 9 de octubre
  */

  if (now < FINAL_DATE) {

    const next = getNextSurprise();

    if (next) {

      const distance = next.date - now;

      showLockedCountdown(
        distance,
        "🔒 Sorpresa bloqueada",
        "La próxima pista todavía no está disponible."
      );

      return;
    }

  }


  /*
  Ya llegó la revelación
  */

  showGame();

}


/*
=========================================================
              MOSTRAR CUENTA REGRESIVA
=========================================================
*/

function showLockedCountdown(distance, title, text) {

  document.getElementById("locked").classList.remove("hidden");

  document.getElementById("game").classList.add("hidden");

  document.getElementById("lockedTitle").textContent = title;

  document.getElementById("lockedText").textContent = text;


  const d =
    Math.floor(distance / 86400000);

  const h =
    Math.floor(
      (distance % 86400000) / 3600000
    );

  const m =
    Math.floor(
      (distance % 3600000) / 60000
    );

  const s =
    Math.floor(
      (distance % 60000) / 1000
    );


  document.getElementById("countdown").textContent =
    `${d}d ${h}h ${m}m ${s}s`;
}


/*
=========================================================
                    MOSTRAR JUEGO
=========================================================
*/

function showGame() {

  const now = new Date();


  /*
  -----------------------------------------------
  REVELACIÓN FINAL
  -----------------------------------------------
  */

  if (now >= FINAL_DATE) {

    document.getElementById("locked").classList.add("hidden");

    document.getElementById("game").classList.remove("hidden");

    document.getElementById("emoji").textContent = "🎁";

    document.getElementById("title").textContent =
      "AHORA SÍ ❤️";

    document.getElementById("text").innerHTML =
      "Has esperado hasta el final.<br><br>" +

      "Has resuelto las pistas.<br>" +
      "Has recordado nuestros momentos.<br>" +
      "Y finalmente llegó el día. 🥹<br><br>" +

      "<strong>¿Estás listo para descubrirlo?</strong>";

    document.getElementById("buttons").innerHTML = "";

    const btn =
      document.createElement("button");

    btn.textContent =
      "DESCUBRIR LA SORPRESA 😭";

    btn.onclick = revealFinal;

    document.getElementById("buttons").appendChild(btn);

    document.getElementById("extra").innerHTML = "";

    document.getElementById("progress").textContent =
      "💌 9 de octubre — Fin de la misión";

    return;
  }


  /*
  -----------------------------------------------
  SORPRESA ACTUAL
  -----------------------------------------------
  */

  const surprise = getCurrentSurprise();

  document.getElementById("locked").classList.add("hidden");

  document.getElementById("game").classList.remove("hidden");

  document.getElementById("emoji").textContent =
    surprise.emoji;

  document.getElementById("title").textContent =
    surprise.title;

  document.getElementById("text").innerHTML =
    surprise.text;


  document.getElementById("buttons").innerHTML = "";

  document.getElementById("extra").innerHTML = "";


  /*
  -----------------------------------------------
  JUEGO DEL CÓDIGO
  -----------------------------------------------
  */

  if (surprise.codeGame) {

    const input =
      document.createElement("input");

    input.type = "text";
    input.placeholder = "Código";
    input.maxLength = 10;

    const button =
      document.createElement("button");

    button.textContent =
      "DESBLOQUEAR 🔓";


    button.onclick = function() {

      if (input.value.trim() === SECRET_CODE) {

        document.getElementById("text").innerHTML =
          surprise.success;

        document.getElementById("buttons").innerHTML = "";

        document.getElementById("extra").innerHTML = "";

      } else {

        document.getElementById("extra").innerHTML =
          "<p>❌ Mmm... ese no parece ser.</p>";

      }

    };


    document.getElementById("buttons").appendChild(input);

    document.getElementById("buttons").appendChild(button);

  }


  /*
  -----------------------------------------------
  BOTONES NORMALES
  -----------------------------------------------
  */

  else {

    surprise.buttons.forEach(option => {

      const btn =
        document.createElement("button");

      btn.textContent =
        option.text;


      btn.onclick = function() {

        if (option.correct) {

          document.getElementById("text").innerHTML =
            surprise.success;

          document.getElementById("buttons").innerHTML = "";

        } else {

          document.getElementById("text").innerHTML =
            "JAJAJA NO 😭<br><br>" +
            "Intenta otra vez.";

        }

      };


      document.getElementById("buttons").appendChild(btn);

    });

  }


  /*
  -----------------------------------------------
  PROGRESO
  -----------------------------------------------
  */

  const index =
    surprises.indexOf(surprise);

  document.getElementById("progress").textContent =
    `Pista ${index + 1} de ${surprises.length} 💌`;

}


/*
=========================================================
                REVELACIÓN FINAL
=========================================================
*/

function revealFinal() {

  document.getElementById("emoji").textContent =
    "📍";

  document.getElementById("title").textContent =
    "NUESTRA SORPRESA ❤️";


  document.getElementById("text").innerHTML =
    "Bueno... 🤭<br><br>" +

    "Creo que ya sufriste suficiente esperando.<br><br>" +

    "<strong>Así que aquí está:</strong>";


  document.getElementById("buttons").innerHTML = "";


  /*
  =====================================================
  CAMBIA AQUÍ EL LUGAR DE LA SORPRESA
  =====================================================
  */

  document.getElementById("extra").innerHTML =

    "<div class='final-place'>" +

    "📍 LUGAR SORPRESA" +

    "</div>" +

    "<p style='margin-top:25px'>" +

    "Nos vemos ahí. ❤️<br><br>" +

    "<strong>Feliz primer mes. 🥹💗</strong>" +

    "</p>";


  document.getElementById("progress").textContent =
    "💌 Misión completada";
}


/*
=========================================================
                 INICIAR PÁGINA
=========================================================
*/

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
